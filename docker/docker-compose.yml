name: vatly-pmpro

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wp
    depends_on:
      db:
        condition: service_healthy
      mock-vatly:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      # Mount the plugin source live so edits hot-reload.
      - ..:/var/www/html/wp-content/plugins/vatly-gateway-for-paid-memberships-pro
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  wp-cli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/vatly-gateway-for-paid-memberships-pro
      - ./setup.sh:/usr/local/bin/setup-vatly-pmpro.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["-c", "tail -f /dev/null"]

  # Lightweight mock of the Vatly API — just enough to drive the plugin through
  # checkout, return, webhook delivery and cancellation locally. Used by the
  # integration tests too.
  mock-vatly:
    build:
      context: ./mock-vatly
    environment:
      MOCK_VATLY_PUBLIC_URL: http://localhost:8081
    ports:
      - "8081:8080"

volumes:
  db_data:
  wp_data:

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build scoped release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' if present (v0.1.0 → 0.1.0).
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Build scoped release zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bin/build-release.sh

      - name: Verify scoped output
        run: |
          set -e
          SCOPED="build/scoped/vatly-gateway-for-paid-memberships-pro"

          # Confirm our source classes are namespace-prefixed.
          grep -q "namespace Vatly\\\\PMPro\\\\Vendor\\\\Vatly\\\\PMPro" "${SCOPED}/src/Plugin.php"

          # Confirm third-party deps are scoped.
          grep -q "namespace Vatly\\\\PMPro\\\\Vendor\\\\Composer\\\\CaBundle" "${SCOPED}/vendor/composer/ca-bundle/src/CaBundle.php"

          # Confirm the global gateway class name is preserved (PMPro needs it
          # by exactly this name).
          grep -q "class PMProGateway_vatly extends \\\\PMProGateway" "${SCOPED}/includes/class-pmprogateway-vatly.php"

          # Confirm vendor/autoload.php exists and the classmap is populated.
          test -f "${SCOPED}/vendor/autoload.php"
          test -f "${SCOPED}/vendor/composer/autoload_classmap.php"
          grep -c "Vatly\\\\\\\\PMPro\\\\\\\\Vendor" "${SCOPED}/vendor/composer/autoload_classmap.php" \
            | awk '$1 < 50 { print "Classmap looks empty"; exit 1 }'

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.ref }}
          files: build/vatly-gateway-for-paid-memberships-pro-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same branch so PRs don't
# pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer validate + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # `--abandoned=report` keeps abandoned-package warnings visible but
      # doesn't fail the build (those come from upstream phpunit transitively).
      # Dev deps are audited by default — there's no opt-in flag, and passing
      # `--no-dev` would *exclude* them.
      - name: Composer audit
        run: composer audit --abandoned=report

  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Syntax lint
        run: |
          find src includes -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: PHPUnit unit suite
        run: composer test:unit

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: composer analyse

  cs:
    name: WPCS
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, cs2pr

      - run: composer install --no-interaction --prefer-dist

      - name: WPCS
        run: composer phpcs -- --report=checkstyle | cs2pr

  docker-build:
    name: Docker smoke build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build mock-vatly image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mock-vatly
          push: false

      - name: Build WordPress image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.wp
          push: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same branch so PRs don't
# pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer validate + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # `--abandoned=report` keeps abandoned-package warnings visible but
      # doesn't fail the build (those come from upstream phpunit transitively).
      # Dev deps are audited by default — there's no opt-in flag, and passing
      # `--no-dev` would *exclude* them.
      - name: Composer audit
        run: composer audit --abandoned=report

  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Syntax lint
        run: |
          find src includes -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: PHPUnit unit suite
        run: composer test:unit

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: composer analyse

  cs:
    name: WPCS
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, cs2pr

      - run: composer install --no-interaction --prefer-dist

      # `-q` suppresses the progress bar + timing footer that PHPCS would
      # otherwise interleave with the checkstyle XML, which cs2pr can't parse.
      - name: WPCS
        run: composer phpcs -- -q --report=checkstyle | cs2pr

  wp-integration:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Cover the corners that actually break in practice:
        #   - 6.2 + PHP 8.0: minimum we claim to support
        #   - latest + PHP 8.3: current stable
        #   - trunk + PHP 8.3: forward-looking, allowed to fail
        include:
          - { wp: '6.2', php: '8.0', allow_failure: false }
          - { wp: 'latest', php: '8.3', allow_failure: false }
          - { wp: 'trunk', php: '8.3', allow_failure: true }
    continue-on-error: ${{ matrix.allow_failure }}

    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_PHPUNIT__WP_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Install plugin deps
        run: composer install --no-interaction --prefer-dist

      - name: Download WordPress ${{ matrix.wp }}
        run: |
          set -euxo pipefail
          mkdir -p "${WP_PHPUNIT__WP_DIR}"
          case "${{ matrix.wp }}" in
            trunk)
              # Nightly tarball lives at /nightly-builds/wordpress-latest.zip
              curl -sLo /tmp/wp.zip https://wordpress.org/nightly-builds/wordpress-latest.zip
              unzip -q /tmp/wp.zip -d /tmp/
              mv /tmp/wordpress/* "${WP_PHPUNIT__WP_DIR}/"
              ;;
            latest)
              curl -sL https://wordpress.org/latest.tar.gz \
                | tar -xz --strip-components=1 -C "${WP_PHPUNIT__WP_DIR}"
              ;;
            *)
              curl -sL "https://wordpress.org/wordpress-${{ matrix.wp }}.tar.gz" \
                | tar -xz --strip-components=1 -C "${WP_PHPUNIT__WP_DIR}"
              ;;
          esac
          # Sanity: a freshly-extracted source has wp-load.php at its root.
          test -f "${WP_PHPUNIT__WP_DIR}/wp-load.php"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 1
          done
          echo "MySQL did not come up in time"; exit 1

      - name: PHPUnit integration suite
        run: composer test:integration

  docker-build:
    name: Docker smoke build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build mock-vatly image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mock-vatly
          push: false

      - name: Build WordPress image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.wp
          push: false
